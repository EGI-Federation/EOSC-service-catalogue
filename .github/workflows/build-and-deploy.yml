---
name: Build and push containers

on:
  release:
    types: [released]
  pull_request:

permissions: read-all

jobs:
  builder:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # This is needed for PBR get the right version
          fetch-depth: 0
          persist-credentials: false
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: registry.egi.eu/cloud.egi.eu/eosc-service-catalogue
          tags: |
            type=sha
            type=pep440,pattern={{version}}
            latest
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to Registry 
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: registry.egi.eu
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
        if: github.event_name == 'release'
      - name: Build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          context: .
      - name: Get helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2
        if: github.event_name == 'release'
      - name: deploy 
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
          IMAGE_PULL_CREDENTIALS: ${{ secrets.IMAGE_PULL_CREDENTIALS }}
        run: |
          mkdir ~/.kube
          echo "$KUBECONFIG" > ./kubeconfig
          export KUBECONFIG="./kubeconfig"
          echo "$IMAGE_PULL_CREDENTIALS" > config.yaml
          helm upgrade --install eosc-svc ./chart/eosc-service-registry/ -n egi-ops-portal-ns \
            -f config.yaml --set image.tag="sha-$(git rev-parse --short HEAD)"
        if: github.event_name == 'release'
