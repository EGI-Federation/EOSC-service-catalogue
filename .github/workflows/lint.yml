---
name: Lint

permissions: read-all

on:
  push:
  pull_request:

jobs:
  super-lint:
    name: Lint with Super-Linter
    runs-on: ubuntu-latest

    steps:
      # Checks out a copy of your repository on the ubuntu-latest machine
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Make sure the actual branch is checked out when running on PR
          # ref: ${{ github.event.pull_request.head.sha }}
          # Full git history needed to get proper list of changed files
          fetch-depth: 0
          persist-credentials: false

      # Runs the Super-Linter action
      - name: Run Super-Linter on new changes
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKDOWN_CONFIG_FILE: .markdownlint.json
          # Only check new or edited files
          VALIDATE_ALL_CODEBASE: true 
          # Not dealing with pylint
          VALIDATE_PYTHON_PYLINT: false
          # this will scream about line too long and we already have ruff
          VALIDATE_PYTHON_FLAKE8: false
          # in conflict with black
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # there is a lot of copy paste in the services
          VALIDATE_JSCPD: false
          # in conflict with biome
          VALIDATE_JSON_PRETTIER: false
          # some stuff go bad with helm charts
          VALIDATE_KUBERNETES_KUBECONFORM: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_YAML: false
          # may look into enabling this in the future
          VALIDATE_TRIVY: false
          # Fail on errors
          DISABLE_ERRORS: false
