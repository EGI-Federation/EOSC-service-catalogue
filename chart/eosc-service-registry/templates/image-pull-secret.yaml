---
{{- if .Values.imageCredentials.username }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eosc-service-registry.fullname" . }}-pullsecrets
  labels:
    {{- include "eosc-service-registry.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
