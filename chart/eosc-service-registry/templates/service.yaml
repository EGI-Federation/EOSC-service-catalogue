apiVersion: v1
kind: Service
metadata:
  name: {{ include "eosc-service-registry.fullname" . }}
  labels:
    {{- include "eosc-service-registry.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace is set elsewhere
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "eosc-service-registry.selectorLabels" . | nindent 4 }}
