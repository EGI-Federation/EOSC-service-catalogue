  name: Cloud Compute
  webpage: https://www.egi.eu/service/cloud-compute/
  description: >>>
    Cloud Compute gives you the ability to deploy and scale virtual machines on-demand.
    It offers guaranteed computational resources in a secure and isolated environment
    with standard API access, without the overhead of managing physical servers.

    With EGI Cloud Compute, you can easily select pre-configured virtual appliances from
    our extensive catalogue, which is replicated across all EGI cloud providers. This means
    you can access a wide variety of computing resources without having to worry about
    maintenance, upgrades, or hardware failures. You can also scale up or down your
    computing resources based on your research needs, without disrupting your workflow.

    With Cloud Compute you can:

    - Execute compute- and data-intensive workloads (both batch and interactive)

    - Host long-running services (e.g. web servers, databases or applications servers)

    - Create disposable testing and development environments on virtual machines and
      scale your infrastructure needs

    - Select virtual machine configurations (CPU, memory, disk) and application environments
      to fit your requirements

    - Manage your Cloud Compute resources in a flexible way with integrated
      monitoring and accounting capabilities
