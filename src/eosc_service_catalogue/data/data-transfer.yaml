  name: Data Transfer
  webpage: https://www.egi.eu/service/data-transfer/
  description: |
    Data Transfer allows you to move any type of data files asynchronously from one
    storage location to another using different protocols (HTTP/Webdav, gsiftp, XRootD)
    The Data Transfer service has mechanisms to ensure automatic retry in case of failure and optimize transfer bandwith.
    The service includes dedicated interfaces to display statistics of on-going transfers and manage network resources.
    
    Main characteristics:
    - Ideal for very large files
    - Able to handle large amounts of files
    - Transfer process with automatic retry
