  description: |
    With FitSM Training, you will learn the fundamentals of IT service management and
    how to implement FitSM in your organisation through a combination of lessons and
    examples.

    FitSM is a lightweight standard for IT service management. It brings order and
    traceability with simple, practical support and provides a common conceptual and
    process model setting out realistic requirements.

    The training programme is structured in three levels: Foundation, Advanced and
    Expert and is accredited by APMG, a global leader in standardisation and
    certification.

    With FitSM training, you can:
    - Increase your expertise in managing IT services
    - Raise your professional profile with a recognised certification
