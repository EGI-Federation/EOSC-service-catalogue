  description:
    Infrastructure Manager (IM) is an open-source service that deploys complex and
    customised virtual infrastructures on multiple clouds. IM automates the deployment,
    configuration, software installation, monitoring and update of virtual
    infrastructures. It supports a wide variety of public and on-premises Cloud
    back-ends, thus making user applications Cloud agnostic. In addition, it features
    DevOps capabilities, based on Ansible to enable the installation and configuration
    of all the user required applications providing the user with a fully functional
    infrastructure.
