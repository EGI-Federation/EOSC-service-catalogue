  description: |
    The Online Storage service offers different options for data storage: 
    - Object storage:  manages data as objects and allows relatively inexpensive, 
    scalable and self-healing retention of massive amounts of unstructured data 
    - File Storage : Highly scalable storage system accessible from anywhere allowing to easily 
    share data through different standard interfaces. It assigns global identifiers to files and allows to organise
    your data using a flexible hierarchical structure.
    - Block Storage:  block-level storage solution that allows you
    to expand the storage capacity of your instances in the EGI Federated Cloud.

