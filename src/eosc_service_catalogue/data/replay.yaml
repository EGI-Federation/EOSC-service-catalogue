  webpage: https://www.egi.eu/services/replay/
  description:
    Replay allows reproducing and sharing custom computing environments for replicating
    the execution of analysis in a notebooks-based platform. Based on the Binder
    technology, Replay builds your environment on the fly from a code repository that
    contains the code (e.g. notebook) you'd like to run and a set of configuration files
    that determine the exact computing environment to run it. The service generates
    shareable links for others to interact with your content easily from any browser,
    reproduce your analysis and access data available in EGI's infrastructure.
