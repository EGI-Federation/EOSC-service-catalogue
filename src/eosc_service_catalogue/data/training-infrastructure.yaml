  name: Training Infrastructure
  webpage: https://www.egi.eu/service/training-infrastructure/
  description: |
    The Training Infrastructure is a cloud-based computing and storage resources for
    training events. It is useful to organise onsite tutorials or workshops and online
    training courses or as a platform for self-paced learning.

    Trainers can deploy custom virtual machine images on the Training Infrastructure as
    the training environment for the students. The virtual machines can be customised
    according to specific needs and the community can benefit from the easy deployment
    and easy reuse of course materials.

    The Training Infrastructure uses the same high-quality computing and storage
    environment that EGI provides to researchers.

    Main characteristics:
    - Target-specific courses and added value for scientific communities
    - Easy-to-use, on-demand access and improvements in the training offer
    - Allows easy deployment of courses and reuse
